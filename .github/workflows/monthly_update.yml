name: Monthly Argentina Macro Pipeline Update

on:
  schedule:
    # Automated monthly run on the 25th of each month at 09:00 UTC
    - cron: "0 9 25 * *"
  workflow_dispatch:
    inputs:
      prefer_network:
        description: "Download fresh data live from the 7 official sources (.gob.ar / World Bank)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  run-macro-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Cloud SDK (gcloud & bq)
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/setup-gcloud@v2

      - name: Authenticate & Hydrate Bronze raw cache from GCS Medallion Lake
        if: env.GCP_SA_KEY != ''
        run: |
          printf '%s' "$GCP_SA_KEY" > /tmp/gcp_sa.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/gcp_sa.json" >> "$GITHUB_ENV"
          gcloud auth activate-service-account --key-file=/tmp/gcp_sa.json
          gcloud config set project argentina-macro-pipeline
          mkdir -p data/raw_cache
          gcloud storage cp "gs://argentina-macro-lake-31037835126/bronze/latest/*" data/raw_cache/ || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Golden Anchor & Transformer Unit Tests
        run: |
          pytest -v

      - name: Execute Argentina Macro Pipeline & Sync Medallion Lake
        env:
          PREFER_NETWORK: ${{ github.event.inputs.prefer_network || 'true' }}
          GCP_LAKE_SYNC: "true"
          GCP_PROJECT_ID: "argentina-macro-pipeline"
          GCS_LAKE_BUCKET: "gs://argentina-macro-lake-31037835126"
          BQ_DATASET: "macro_lake"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_APIKEY: ${{ secrets.WHATSAPP_APIKEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: |
          python -m src.main

      - name: Upload Generated Figures & JSON Contracts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: argentina-macro-outputs
          path: |
            outputs/macro_argentina_latest.json
            outputs/run_report_latest.json
            outputs/figures/*.png
            outputs/figures/*.svg
            outputs/regime_shift_pr_proposal.md

      - name: Commit updated snapshots and outputs on main
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw_cache/manifest.json data/last_known_good/ outputs/macro_argentina_latest.json outputs/run_report_latest.json outputs/figures/
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): automated monthly macro series and figures update"
            git push
          fi

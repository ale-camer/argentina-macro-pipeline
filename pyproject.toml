[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argentina-macro-pipeline"
version = "1.0.0"
description = "Deterministic data engineering, quantitative macroeconomic analysis, and JSON contract engine for Argentina (1961–Present), with encapsulated self-healing and regime-shift evaluation agents."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Alejandro Camerlengo" }
]
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "statsmodels>=0.14.0",
    "ruptures>=1.1.9",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "google-genai>=1.0.0",
    "pyyaml>=6.0.1",
    "openpyxl>=3.1.2",
    "xlrd>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
argentina-macro-pipeline = "src.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]
